<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Claude Throttle Tracker — Are your limits 2× right now?</title>
  <meta name="description" content="Live tracker for Anthropic's 2× usage limit boost outside peak hours. See if your Claude limits are doubled right now.">

  <!-- Favicon: green lightning bolt SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Fonts: preconnect + link (non-render-blocking with display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --fg: #e8e8e8;
      --accent: #00ff88;
      --accent-dim: #00cc6a;
      --peak: #ff6b6b;
      --peak-dim: #cc5555;
      --muted: #666;
      --card-bg: #111;
      --border: #222;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Subtle scanline overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      z-index: 1000;
    }

    main {
      text-align: center;
      max-width: 700px;
      width: 100%;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      border: 1px solid transparent;
    }

    .status-badge[data-state="boosted"] {
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent);
      border-color: rgba(0, 255, 136, 0.3);
    }

    .status-badge[data-state="peak"] {
      background: rgba(255, 107, 107, 0.1);
      color: var(--peak);
      border-color: rgba(255, 107, 107, 0.3);
    }

    .status-badge[data-state="expired"],
    .status-badge[data-state="not-started"] {
      background: rgba(102, 102, 102, 0.1);
      color: var(--muted);
      border-color: rgba(102, 102, 102, 0.3);
    }

    .hero-text {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 3rem);
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .hero-text[data-state="boosted"] { color: var(--accent); }
    .hero-text[data-state="peak"]    { color: var(--peak); }
    .hero-text[data-state="expired"],
    .hero-text[data-state="not-started"] { color: var(--muted); }

    .countdown {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 4.8rem);
      letter-spacing: 0.02em;
      margin: 0.5rem 0 1.5rem;
      min-height: 1.2em; /* prevent layout shift when empty */
    }

    .countdown[data-state="boosted"] {
      color: var(--accent);
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    }

    .countdown[data-state="peak"] {
      color: var(--peak);
      text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
    }

    .countdown[data-state="expired"],
    .countdown[data-state="not-started"] {
      color: var(--muted);
    }

    .sub-text {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto 2.5rem;
    }

    .sub-text .tz {
      font-family: 'Space Mono', monospace;
      color: var(--fg);
      font-size: 0.85rem;
      opacity: 0.7;
      display: block;
      margin-top: 0.25rem;
    }

    /* Schedule card */
    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 0 auto 2rem;
      max-width: 460px;
      text-align: left;
    }

    .schedule-card h2 {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .schedule-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      gap: 1rem;
    }

    .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-row .label {
      color: var(--fg);
    }

    .schedule-row .value {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .schedule-row .value.green { color: var(--accent); }
    .schedule-row .value.red   { color: var(--peak); }

    /* Progress bar */
    .progress-wrap {
      max-width: 460px;
      margin: 0 auto 2.5rem;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-family: 'Space Mono', monospace;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s linear;
      width: 0%;
    }

    .progress-fill[data-state="boosted"] {
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
    }

    .progress-fill[data-state="peak"] {
      background: var(--peak);
      box-shadow: 0 0 10px rgba(255, 107, 107, 0.4);
    }

    .progress-fill[data-state="expired"] {
      background: var(--muted);
    }

    /* Footer */
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.8;
      width: 100%;
      max-width: 700px;
    }

    footer a {
      color: var(--fg);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* Pulse animation for active 2x — respects reduced motion */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .pulse {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
      }
      .progress-fill {
        transition: none;
      }
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .schedule-card {
        padding: 1rem;
      }
      .schedule-row {
        font-size: 0.8rem;
        flex-wrap: wrap;
      }
      footer {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main role="main">
    <h1>Claude Throttle Tracker</h1>

    <div id="status-badge" class="status-badge" role="status" aria-live="polite"></div>

    <p id="hero" class="hero-text" aria-live="polite"></p>

    <p id="countdown" class="countdown" aria-live="off" aria-atomic="true"></p>

    <p id="sub" class="sub-text"></p>

    <div class="progress-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Time remaining in current period" id="progress-section">
      <div class="progress-labels">
        <span id="prog-left"></span>
        <span id="prog-right"></span>
      </div>
      <div class="progress-bar-bg">
        <div id="prog-fill" class="progress-fill"></div>
      </div>
    </div>

    <div class="schedule-card" aria-label="Boost schedule">
      <h2>Schedule (Pacific Time)</h2>
      <div class="schedule-row">
        <span class="label">Weekdays 5 AM – 11 AM PT</span>
        <span class="value red">Peak (1×)</span>
      </div>
      <div class="schedule-row">
        <span class="label">Weekdays 11 AM – 5 AM PT</span>
        <span class="value green">2× Boost</span>
      </div>
      <div class="schedule-row">
        <span class="label">Weekends (all day)</span>
        <span class="value green">2× Boost</span>
      </div>
      <div class="schedule-row">
        <span class="label">Boost period</span>
        <span class="value">Mar 14 – Mar 28, 2026</span>
      </div>
    </div>
  </main>

  <footer>
    Built with &#10084;&#65039; by Orcas | Follow
    <a href="https://x.com/p_naix" target="_blank" rel="noopener noreferrer">@p_naix</a>
    <a href="https://x.com/get_orcas" target="_blank" rel="noopener noreferrer">@get_orcas</a>
    on &#120143; |
    <a href="https://getorcas.com" target="_blank" rel="noopener noreferrer">getorcas.com</a>
  </footer>

  <script>
    'use strict';

    // ─────────────────────────────────────────────────────────────────────
    // CONSTANTS
    // ─────────────────────────────────────────────────────────────────────
    var PT_TZ = 'America/Los_Angeles';
    var PEAK_START_HOUR = 5;   // 5:00 AM PT
    var PEAK_END_HOUR   = 11;  // 11:00 AM PT (peak is 5:00–10:59:59.999)

    // Boost period: March 14, 2026 00:00:00 PT → March 28, 2026 23:59:59.999 PT
    // Computed dynamically via ptToUTC (no hardcoded UTC offset).
    // We defer initialization until ptToUTC is defined.
    var BOOST_START;
    var BOOST_END;

    // Reusable Intl formatter — allocated once, used everywhere.
    var ptFormatter = new Intl.DateTimeFormat('en-US', {
      timeZone: PT_TZ,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false,
      weekday: 'short'
    });

    // ─────────────────────────────────────────────────────────────────────
    // TIMEZONE ENGINE
    // ─────────────────────────────────────────────────────────────────────

    /**
     * Parse Intl.formatToParts output into a plain object.
     * Uses the shared ptFormatter. Safe: only reads browser-provided values,
     * never injects them into DOM via innerHTML.
     */
    function parsePTComponents(date) {
      var parts = ptFormatter.formatToParts(date);
      var map = {};
      for (var i = 0; i < parts.length; i++) {
        map[parts[i].type] = parts[i].value;
      }
      return {
        year:    +map.year,
        month:   +map.month,
        day:     +map.day,
        hour:    (+map.hour) % 24,  // some engines return "24" for midnight
        minute:  +map.minute,
        second:  +map.second,
        weekday: map.weekday         // "Mon", "Tue", … "Sat", "Sun"
      };
    }

    /**
     * Convert a Pacific Time wall-clock to a UTC Date.
     *
     * Strategy (no string parsing, no new Date(string)):
     *   1. Treat the PT components as UTC → "guess"
     *   2. Ask Intl what PT wall-clock corresponds to that guess
     *   3. Compute offset = guess_as_utc − pt_components_as_utc
     *   4. Result = guess + offset
     *   5. Verify & correct for DST boundary (one extra iteration max)
     */
    function ptToUTC(year, month, day, hour, minute, second) {
      // Step 1: treat target wall-clock as if it were UTC
      var guess = Date.UTC(year, month - 1, day, hour, minute, second || 0);

      // Step 2: what does a PT clock show at this UTC instant?
      var ptAt = parsePTComponents(new Date(guess));
      var ptAsUTC = Date.UTC(ptAt.year, ptAt.month - 1, ptAt.day, ptAt.hour, ptAt.minute, ptAt.second);

      // Step 3: offset
      var offset = guess - ptAsUTC;

      // Step 4: candidate result
      var result = guess + offset;

      // Step 5: verify — at the candidate, does PT show our target?
      var verify = parsePTComponents(new Date(result));
      var verifyAsUTC = Date.UTC(verify.year, verify.month - 1, verify.day, verify.hour, verify.minute, verify.second);

      if (verifyAsUTC !== guess) {
        // DST boundary correction: recompute offset at the result timestamp
        var offset2 = guess - verifyAsUTC;
        result = guess + offset2;
      }

      return new Date(result);
    }

    /**
     * Get the current time decomposed into PT components + the raw Date.
     */
    function getNowPT() {
      var now = new Date();
      var c = parsePTComponents(now);
      c.now = now;
      return c;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Initialize boost period boundaries (uses ptToUTC, so must come after)
    // ─────────────────────────────────────────────────────────────────────
    BOOST_START = ptToUTC(2026, 3, 14, 0, 0, 0);     // Mar 14 00:00:00 PT
    BOOST_END   = ptToUTC(2026, 3, 29, 0, 0, 0);     // Mar 29 00:00:00 PT = Mar 28 23:59:59.999+1ms

    // We actually want "end of March 28", so subtract 1ms
    BOOST_END = new Date(BOOST_END.getTime() - 1);

    // ─────────────────────────────────────────────────────────────────────
    // STATE LOGIC
    // ─────────────────────────────────────────────────────────────────────

    function isWeekend(weekday) {
      return weekday === 'Sat' || weekday === 'Sun';
    }

    /**
     * Determine if a given PT hour falls within peak (5:00 AM – 10:59:59 AM).
     * Boundary: 5:00:00.000 AM = peak, 11:00:00.000 AM = NOT peak.
     */
    function isPeakHour(hour) {
      return hour >= PEAK_START_HOUR && hour < PEAK_END_HOUR;
    }

    /**
     * Get the day-of-week (0=Sun, 6=Sat) for a PT date using only PT components.
     * Avoids using local `new Date()` which could give wrong day for UTC+12/+14 users.
     */
    function ptDayOfWeek(year, month, day) {
      // Zeller-like formula or just use Date.UTC which is timezone-independent
      return new Date(Date.UTC(year, month - 1, day)).getUTCDay();
    }

    /**
     * Find the UTC timestamp of the NEXT peak start (weekday at PEAK_START_HOUR PT)
     * relative to the given PT components.
     */
    function findNextPeakStart(pt) {
      // If today is a weekday and we haven't reached peak yet, peak is today
      var dow = ptDayOfWeek(pt.year, pt.month, pt.day);
      if (dow >= 1 && dow <= 5 && pt.hour < PEAK_START_HOUR) {
        return ptToUTC(pt.year, pt.month, pt.day, PEAK_START_HOUR, 0, 0).getTime();
      }

      // Walk forward up to 7 days to find next weekday
      for (var i = 1; i <= 7; i++) {
        // Use Date.UTC to safely add days without local TZ interference
        var future = new Date(Date.UTC(pt.year, pt.month - 1, pt.day + i));
        var fDow = future.getUTCDay();
        if (fDow >= 1 && fDow <= 5) {
          return ptToUTC(
            future.getUTCFullYear(),
            future.getUTCMonth() + 1,
            future.getUTCDate(),
            PEAK_START_HOUR, 0, 0
          ).getTime();
        }
      }
      // Should never reach here, but safety fallback
      return BOOST_END.getTime();
    }

    /**
     * Find the most recent peak end (weekday at PEAK_END_HOUR PT) at or before now.
     * Used to compute when the current boost period started.
     */
    function findPreviousPeakEnd(pt) {
      for (var i = 0; i <= 7; i++) {
        var past = new Date(Date.UTC(pt.year, pt.month - 1, pt.day - i));
        var dow = past.getUTCDay();
        if (dow >= 1 && dow <= 5) {
          var peakEnd = ptToUTC(
            past.getUTCFullYear(),
            past.getUTCMonth() + 1,
            past.getUTCDate(),
            PEAK_END_HOUR, 0, 0
          );
          if (peakEnd.getTime() <= pt.now.getTime()) {
            return peakEnd;
          }
        }
      }
      // Fallback: boost start
      return BOOST_START;
    }

    /**
     * Core state calculation.
     * Returns: { state, msUntilChange, periodStartMs, periodEndMs }
     *
     * States: "not-started" | "boosted" | "peak" | "expired"
     */
    function getState() {
      var pt = getNowPT();
      var nowMs = pt.now.getTime();
      var startMs = BOOST_START.getTime();
      var endMs = BOOST_END.getTime();

      // Before boost period
      if (nowMs < startMs) {
        return {
          state: 'not-started',
          msUntilChange: startMs - nowMs,
          periodStartMs: nowMs,
          periodEndMs: startMs
        };
      }

      // After boost period
      if (nowMs >= endMs) {
        return {
          state: 'expired',
          msUntilChange: 0,
          periodStartMs: nowMs,
          periodEndMs: nowMs
        };
      }

      var weekend = isWeekend(pt.weekday);
      var peak = !weekend && isPeakHour(pt.hour);

      if (peak) {
        // Currently in peak window
        var peakStart = ptToUTC(pt.year, pt.month, pt.day, PEAK_START_HOUR, 0, 0);
        var peakEnd   = ptToUTC(pt.year, pt.month, pt.day, PEAK_END_HOUR, 0, 0);
        var target    = Math.min(peakEnd.getTime(), endMs);
        return {
          state: 'peak',
          msUntilChange: Math.max(0, target - nowMs),
          periodStartMs: peakStart.getTime(),
          periodEndMs: target
        };
      }

      // Currently boosted (2×)
      var nextPeak = findNextPeakStart(pt);
      var boostTarget = Math.min(nextPeak, endMs);

      // When did this boost period start?
      var boostStart;
      if (weekend || pt.hour < PEAK_START_HOUR) {
        // Weekend all day or weekday before 5 AM: started at last peak end
        boostStart = findPreviousPeakEnd(pt);
      } else {
        // Weekday after 11 AM: started at 11 AM today
        boostStart = ptToUTC(pt.year, pt.month, pt.day, PEAK_END_HOUR, 0, 0);
      }

      return {
        state: 'boosted',
        msUntilChange: Math.max(0, boostTarget - nowMs),
        periodStartMs: boostStart.getTime(),
        periodEndMs: boostTarget
      };
    }

    // ─────────────────────────────────────────────────────────────────────
    // FORMATTING
    // ─────────────────────────────────────────────────────────────────────

    function formatCountdown(ms) {
      if (!isFinite(ms) || ms <= 0) return '0h 0m 0s';
      var totalSec = Math.floor(ms / 1000);
      var h = Math.floor(totalSec / 3600);
      var m = Math.floor((totalSec % 3600) / 60);
      var s = totalSec % 60;
      return h + 'h ' + m + 'm ' + s + 's';
    }

    function getUserTimezone() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone;
      } catch (e) {
        return 'Unknown';
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // DOM — all references cached, all writes via textContent (no innerHTML)
    // ─────────────────────────────────────────────────────────────────────
    var $badge    = document.getElementById('status-badge');
    var $hero     = document.getElementById('hero');
    var $countdown = document.getElementById('countdown');
    var $sub      = document.getElementById('sub');
    var $progWrap = document.getElementById('progress-section');
    var $progFill = document.getElementById('prog-fill');
    var $progLeft = document.getElementById('prog-left');
    var $progRight = document.getElementById('prog-right');
    var $canvas   = document.getElementById('confetti');

    var userTZ = getUserTimezone();

    // Build sub-text safely (no innerHTML with user data)
    function setSubText(message) {
      // Clear existing children
      while ($sub.firstChild) $sub.removeChild($sub.firstChild);
      $sub.appendChild(document.createTextNode(message));
      var tz = document.createElement('span');
      tz.className = 'tz';
      tz.textContent = userTZ;
      $sub.appendChild(tz);
    }

    // Apply data-state attribute to multiple elements
    function setStateAttr(state) {
      var els = [$badge, $hero, $countdown, $progFill];
      for (var i = 0; i < els.length; i++) {
        els[i].setAttribute('data-state', state);
      }
    }

    // Track previous state for transitions
    var prevState = null;

    function render() {
      var result = getState();
      var state = result.state;
      var msUntilChange = result.msUntilChange;
      var periodStartMs = result.periodStartMs;
      var periodEndMs = result.periodEndMs;

      setStateAttr(state);

      if (state === 'not-started') {
        $badge.textContent = 'COMING SOON';
        $hero.textContent = 'The 2× boost starts in';
        $countdown.textContent = formatCountdown(msUntilChange);
        $countdown.classList.remove('pulse');
        setSubText('2× usage limits begin March 14, 2026 \u00b7 ');
        $progLeft.textContent = '';
        $progRight.textContent = 'Starting soon';
        $progFill.style.width = '0%';
        $progWrap.setAttribute('aria-valuenow', '0');
        return;
      }

      if (state === 'expired') {
        $badge.textContent = 'ENDED';
        $hero.textContent = 'The 2\u00d7 boost period has ended';
        $countdown.textContent = '';
        $countdown.classList.remove('pulse');
        setSubText('The promotional 2\u00d7 usage limits ended on March 28, 2026. ');
        $progFill.style.width = '100%';
        $progLeft.textContent = '';
        $progRight.textContent = 'Ended';
        $progWrap.setAttribute('aria-valuenow', '100');
        return;
      }

      if (state === 'boosted') {
        $badge.textContent = '2\u00d7 ACTIVE';
        $hero.textContent = '2\u00d7 maxxing for';
        $countdown.textContent = formatCountdown(msUntilChange);
        $countdown.classList.add('pulse');
        setSubText('Your usage limits are doubled right now \u00b7 ');
        $progLeft.textContent = '2\u00d7 ACTIVE';
        $progRight.textContent = 'Next peak';
      } else {
        // peak
        $badge.textContent = 'PEAK HOURS';
        $hero.textContent = 'Peak throttling \u2014 2\u00d7 resumes in';
        $countdown.textContent = formatCountdown(msUntilChange);
        $countdown.classList.remove('pulse');
        setSubText('Standard usage limits during peak hours \u00b7 ');
        $progLeft.textContent = 'Peak hours';
        $progRight.textContent = '2\u00d7 resumes';
      }

      // Progress bar
      var now = Date.now();
      var elapsed = now - periodStartMs;
      var total = periodEndMs - periodStartMs;
      var pct = total > 0 ? Math.min(100, Math.max(0, (elapsed / total) * 100)) : 0;
      $progFill.style.width = pct.toFixed(1) + '%';
      $progWrap.setAttribute('aria-valuenow', Math.round(pct).toString());

      // Launch confetti on state transition to boosted
      if (state === 'boosted' && prevState !== 'boosted') {
        launchConfetti();
      }
      prevState = state;
    }

    // ─────────────────────────────────────────────────────────────────────
    // CONFETTI — self-cleaning, respects prefers-reduced-motion
    // ─────────────────────────────────────────────────────────────────────
    var confettiRafId = null;

    function launchConfetti() {
      // Respect reduced motion preference
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      // Cancel any in-progress confetti
      if (confettiRafId) {
        cancelAnimationFrame(confettiRafId);
        confettiRafId = null;
      }

      var ctx = $canvas.getContext('2d');
      if (!ctx) return;

      $canvas.width = window.innerWidth;
      $canvas.height = window.innerHeight;

      var particles = [];
      var colors = ['#00ff88', '#00cc6a', '#88ffbb', '#ffffff', '#00ffcc'];
      var count = Math.min(80, Math.floor(window.innerWidth / 8)); // fewer on small screens

      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * $canvas.width,
          y: Math.random() * $canvas.height - $canvas.height,
          w: Math.random() * 8 + 4,
          h: Math.random() * 6 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 3 + 2,
          wobble: Math.random() * 4 - 2,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 6 - 3,
          opacity: 1
        });
      }

      var frame = 0;

      function animate() {
        ctx.clearRect(0, 0, $canvas.width, $canvas.height);
        var alive = false;

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.y += p.speed;
          p.x += p.wobble * Math.sin(frame * 0.05);
          p.rotation += p.rotSpeed;

          if (frame > 60) p.opacity -= 0.01;
          if (p.opacity <= 0) continue;

          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }

        frame++;
        if (alive) {
          confettiRafId = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, $canvas.width, $canvas.height);
          confettiRafId = null;
        }
      }

      confettiRafId = requestAnimationFrame(animate);
    }

    // ─────────────────────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────────────────────

    // Initial render
    prevState = getState().state;
    render();

    // Launch confetti on first load if boosted
    if (prevState === 'boosted') {
      launchConfetti();
    }

    // Tick every second — single interval, no leaks (page-level lifecycle)
    var tickInterval = setInterval(render, 1000);

    // Pause ticking when page is hidden (saves CPU, prevents stale countdowns)
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        clearInterval(tickInterval);
        tickInterval = null;
      } else {
        // Immediately re-render on return (catch up after sleep/tab switch)
        render();
        if (!tickInterval) {
          tickInterval = setInterval(render, 1000);
        }
      }
    });

    // Resize confetti canvas (debounced)
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        $canvas.width = window.innerWidth;
        $canvas.height = window.innerHeight;
        resizeTimer = null;
      }, 150);
    });
  </script>
</body>
</html>
