<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Claude Throttle Tracker — Are your limits 2× right now?</title>
  <meta name="description" content="Live tracker for Anthropic's 2× usage limit boost outside peak hours. See if your Claude limits are doubled right now.">

  <!-- Favicon: green lightning bolt SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Fonts: preconnect + link (non-render-blocking with display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Retro Palette */
      --bg-light: #eedfcc;  /* Top canvas background */
      --bg-dark: #3d3129;   /* Bottom card background */
      
      --text-orange: #eb9e78; /* Accent for countdown */
      --text-muted: #998a7e;  /* Small text */
      --text-white: #f5f0eb;  /* Headings / Light text */
      --text-dark: #3d3129;   /* Dark text on light bg (if needed) */

      --line-color: rgba(123, 92, 70, 0.4); /* Speedlines default */
      --line-fast: rgba(0, 150, 80, 0.4);   /* Green tint for boost */
      --line-slow: rgba(200, 50, 50, 0.4);  /* Red tint for peak */
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-light);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* Outer Wrapper for the split design */
    .hero-card {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 600px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border: 1px solid rgba(123, 92, 70, 0.2);
      display: flex;
      flex-direction: column;
    }

    /* Top Half - Canvas Container */
    .top-section {
      flex: 1;
      position: relative;
      background: var(--bg-light);
    }

    #traffic-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Bottom Half - Info Container */
    .bottom-section {
      background: var(--bg-dark);
      padding: 2.5rem 3rem;
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.2);
    }

    .info-content {
      flex: 1;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--text-white);
      line-height: 1.1;
      margin-bottom: 0.8rem;
    }

    .countdown {
      color: var(--text-orange);
      font-weight: 400;
    }

    .sub-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sub-text .tz {
      opacity: 0.7;
    }

    /* Retro Pixel Crab/Alien Character */
    .pixel-character {
      width: 120px;
      height: 100px;
      position: relative;
      margin-left: 2rem;
      /* Simple CSS block construction */
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 0px;
      flex-shrink: 0;
    }

    .pixel {
      background: var(--text-orange);
    }
    .pixel.empty {
      background: transparent;
    }
    .pixel.eye {
      background: var(--bg-dark); /* cut out */
    }

    /* Footer / Bottom Links */
    .card-footer {
      position: absolute;
      bottom: 1.5rem;
      left: 3rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--text-orange);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .card-footer a:hover {
      opacity: 0.8;
    }

    /* Progress bar - Integrated horizontally */
    .progress-wrap {
      margin-top: 1.5rem;
      max-width: 300px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--text-orange);
      transition: width 1s linear;
      width: 0%;
    }

    footer a {
      color: var(--fg);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* Pulse animation for active 2x — respects reduced motion */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .pulse {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
      }
      .progress-fill {
        transition: none;
      }
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      .hero-card {
        height: auto;
        min-height: 500px;
      }
      .bottom-section {
        flex-direction: column;
        padding: 2rem;
        align-items: flex-start;
      }
      .pixel-character {
        margin-left: 0;
        margin-top: 2rem;
      }
      .card-footer {
        position: relative;
        bottom: 0;
        left: 0;
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="hero-card">
    <div class="top-section">
      <canvas id="traffic-canvas" aria-hidden="true"></canvas>
      <canvas id="confetti" aria-hidden="true"></canvas>
    </div>

    <div class="bottom-section" role="main">
      <div class="info-content">
        <h1>Claude Throttle</h1>
        
        <p class="hero-text" aria-live="polite">
          <span id="hero"></span> 
          <span id="countdown" class="countdown" aria-live="off" aria-atomic="true"></span>
        </p>

        <p id="sub" class="sub-text"></p>

        <div class="progress-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-section">
          <div class="progress-bar-bg">
            <div id="prog-fill" class="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- CSS Pixel Art -->
      <div class="pixel-character">
        <!-- Row 1 -->
        <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel empty"></div><div class="pixel empty"></div>
        
        <!-- Row 2 -->
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel empty"></div>
        
        <!-- Row 3 -->
        <div class="pixel"></div><div class="pixel"></div><div class="pixel eye"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel eye"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div>

        <!-- Row 4 -->
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div>

        <!-- Row 5 -->
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel"></div><div class="pixel"></div>
        <div class="pixel"></div><div class="pixel empty"></div>

        <!-- Row 6 -->
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel empty"></div>
        <div class="pixel"></div><div class="pixel empty"></div><div class="pixel"></div>
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel empty"></div>
        <div class="pixel"></div><div class="pixel empty"></div>

        <!-- Row 7 -->
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel empty"></div>
        <div class="pixel"></div><div class="pixel empty"></div><div class="pixel"></div>
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel empty"></div>
        <div class="pixel"></div><div class="pixel empty"></div>

        <!-- Row 8 -->
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel empty"></div>
        <div class="pixel"></div><div class="pixel empty"></div><div class="pixel empty"></div>
        <div class="pixel empty"></div><div class="pixel"></div><div class="pixel empty"></div>
        <div class="pixel"></div><div class="pixel empty"></div>
      </div>

      <div class="card-footer">
        Built with &#10084;&#65039; by MuraliKP | <a href="#">getOrcas.com</a>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ─────────────────────────────────────────────────────────────────────
    // CONSTANTS
    // ─────────────────────────────────────────────────────────────────────
    var PT_TZ = 'America/Los_Angeles';
    var PEAK_START_HOUR = 5;   // 5:00 AM PT
    var PEAK_END_HOUR   = 11;  // 11:00 AM PT (peak is 5:00–10:59:59.999)

    // Boost period: March 13, 2026 00:00:00 PT → March 27, 2026 23:59:59.999 PT
    // Computed dynamically via ptToUTC (no hardcoded UTC offset).
    // We defer initialization until ptToUTC is defined.
    var BOOST_START;
    var BOOST_END;

    // Reusable Intl formatter — allocated once, used everywhere.
    var ptFormatter = new Intl.DateTimeFormat('en-US', {
      timeZone: PT_TZ,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false,
      weekday: 'short'
    });

    // ─────────────────────────────────────────────────────────────────────
    // TIMEZONE ENGINE
    // ─────────────────────────────────────────────────────────────────────

    /**
     * Parse Intl.formatToParts output into a plain object.
     * Uses the shared ptFormatter. Safe: only reads browser-provided values,
     * never injects them into DOM via innerHTML.
     */
    function parsePTComponents(date) {
      var parts = ptFormatter.formatToParts(date);
      var map = {};
      for (var i = 0; i < parts.length; i++) {
        map[parts[i].type] = parts[i].value;
      }
      return {
        year:    +map.year,
        month:   +map.month,
        day:     +map.day,
        hour:    (+map.hour) % 24,  // some engines return "24" for midnight
        minute:  +map.minute,
        second:  +map.second,
        weekday: map.weekday         // "Mon", "Tue", … "Sat", "Sun"
      };
    }

    /**
     * Convert a Pacific Time wall-clock to a UTC Date.
     *
     * Strategy (no string parsing, no new Date(string)):
     *   1. Treat the PT components as UTC → "guess"
     *   2. Ask Intl what PT wall-clock corresponds to that guess
     *   3. Compute offset = guess_as_utc − pt_components_as_utc
     *   4. Result = guess + offset
     *   5. Verify & correct for DST boundary (one extra iteration max)
     */
    function ptToUTC(year, month, day, hour, minute, second) {
      // Step 1: treat target wall-clock as if it were UTC
      var guess = Date.UTC(year, month - 1, day, hour, minute, second || 0);

      // Step 2: what does a PT clock show at this UTC instant?
      var ptAt = parsePTComponents(new Date(guess));
      var ptAsUTC = Date.UTC(ptAt.year, ptAt.month - 1, ptAt.day, ptAt.hour, ptAt.minute, ptAt.second);

      // Step 3: offset
      var offset = guess - ptAsUTC;

      // Step 4: candidate result
      var result = guess + offset;

      // Step 5: verify — at the candidate, does PT show our target?
      var verify = parsePTComponents(new Date(result));
      var verifyAsUTC = Date.UTC(verify.year, verify.month - 1, verify.day, verify.hour, verify.minute, verify.second);

      if (verifyAsUTC !== guess) {
        // DST boundary correction: recompute offset at the result timestamp
        var offset2 = guess - verifyAsUTC;
        result = guess + offset2;
      }

      return new Date(result);
    }

    /**
     * Get the current time decomposed into PT components + the raw Date.
     */
    function getNowPT() {
      var now = new Date();
      var c = parsePTComponents(now);
      c.now = now;
      return c;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Initialize boost period boundaries (uses ptToUTC, so must come after)
    // ─────────────────────────────────────────────────────────────────────
    BOOST_START = ptToUTC(2026, 3, 13, 0, 0, 0);     // Mar 13 00:00:00 PT
    BOOST_END   = ptToUTC(2026, 3, 28, 0, 0, 0);     // Mar 28 00:00:00 PT = Mar 27 23:59:59.999+1ms

    // We actually want "end of March 27", so subtract 1ms
    BOOST_END = new Date(BOOST_END.getTime() - 1);

    // ─────────────────────────────────────────────────────────────────────
    // STATE LOGIC
    // ─────────────────────────────────────────────────────────────────────

    function isWeekend(weekday) {
      return weekday === 'Sat' || weekday === 'Sun';
    }

    /**
     * Determine if a given PT hour falls within peak (5:00 AM – 10:59:59 AM).
     * Boundary: 5:00:00.000 AM = peak, 11:00:00.000 AM = NOT peak.
     */
    function isPeakHour(hour) {
      return hour >= PEAK_START_HOUR && hour < PEAK_END_HOUR;
    }

    /**
     * Get the day-of-week (0=Sun, 6=Sat) for a PT date using only PT components.
     * Avoids using local `new Date()` which could give wrong day for UTC+12/+14 users.
     */
    function ptDayOfWeek(year, month, day) {
      // Zeller-like formula or just use Date.UTC which is timezone-independent
      return new Date(Date.UTC(year, month - 1, day)).getUTCDay();
    }

    /**
     * Find the UTC timestamp of the NEXT peak start (weekday at PEAK_START_HOUR PT)
     * relative to the given PT components.
     */
    function findNextPeakStart(pt) {
      // If today is a weekday and we haven't reached peak yet, peak is today
      var dow = ptDayOfWeek(pt.year, pt.month, pt.day);
      if (dow >= 1 && dow <= 5 && pt.hour < PEAK_START_HOUR) {
        return ptToUTC(pt.year, pt.month, pt.day, PEAK_START_HOUR, 0, 0).getTime();
      }

      // Walk forward up to 7 days to find next weekday
      for (var i = 1; i <= 7; i++) {
        // Use Date.UTC to safely add days without local TZ interference
        var future = new Date(Date.UTC(pt.year, pt.month - 1, pt.day + i));
        var fDow = future.getUTCDay();
        if (fDow >= 1 && fDow <= 5) {
          return ptToUTC(
            future.getUTCFullYear(),
            future.getUTCMonth() + 1,
            future.getUTCDate(),
            PEAK_START_HOUR, 0, 0
          ).getTime();
        }
      }
      // Should never reach here, but safety fallback
      return BOOST_END.getTime();
    }

    /**
     * Find the most recent peak end (weekday at PEAK_END_HOUR PT) at or before now.
     * Used to compute when the current boost period started.
     */
    function findPreviousPeakEnd(pt) {
      for (var i = 0; i <= 7; i++) {
        var past = new Date(Date.UTC(pt.year, pt.month - 1, pt.day - i));
        var dow = past.getUTCDay();
        if (dow >= 1 && dow <= 5) {
          var peakEnd = ptToUTC(
            past.getUTCFullYear(),
            past.getUTCMonth() + 1,
            past.getUTCDate(),
            PEAK_END_HOUR, 0, 0
          );
          if (peakEnd.getTime() <= pt.now.getTime()) {
            return peakEnd;
          }
        }
      }
      // Fallback: boost start
      return BOOST_START;
    }

    /**
     * Core state calculation.
     * Returns: { state, msUntilChange, periodStartMs, periodEndMs }
     *
     * States: "not-started" | "boosted" | "peak" | "expired"
     */
    function getState() {
      var pt = getNowPT();
      var nowMs = pt.now.getTime();
      var startMs = BOOST_START.getTime();
      var endMs = BOOST_END.getTime();

      // Before boost period
      if (nowMs < startMs) {
        return {
          state: 'not-started',
          msUntilChange: startMs - nowMs,
          periodStartMs: nowMs,
          periodEndMs: startMs
        };
      }

      // After boost period
      if (nowMs >= endMs) {
        return {
          state: 'expired',
          msUntilChange: 0,
          periodStartMs: nowMs,
          periodEndMs: nowMs
        };
      }

      var weekend = isWeekend(pt.weekday);
      var peak = !weekend && isPeakHour(pt.hour);

      if (peak) {
        // Currently in peak window
        var peakStart = ptToUTC(pt.year, pt.month, pt.day, PEAK_START_HOUR, 0, 0);
        var peakEnd   = ptToUTC(pt.year, pt.month, pt.day, PEAK_END_HOUR, 0, 0);
        var target    = Math.min(peakEnd.getTime(), endMs);
        return {
          state: 'peak',
          msUntilChange: Math.max(0, target - nowMs),
          periodStartMs: peakStart.getTime(),
          periodEndMs: target
        };
      }

      // Currently boosted (2×)
      var nextPeak = findNextPeakStart(pt);
      var boostTarget = Math.min(nextPeak, endMs);

      // When did this boost period start?
      var boostStart;
      if (weekend || pt.hour < PEAK_START_HOUR) {
        // Weekend all day or weekday before 5 AM: started at last peak end
        boostStart = findPreviousPeakEnd(pt);
      } else {
        // Weekday after 11 AM: started at 11 AM today
        boostStart = ptToUTC(pt.year, pt.month, pt.day, PEAK_END_HOUR, 0, 0);
      }

      return {
        state: 'boosted',
        msUntilChange: Math.max(0, boostTarget - nowMs),
        periodStartMs: boostStart.getTime(),
        periodEndMs: boostTarget
      };
    }

    // ─────────────────────────────────────────────────────────────────────
    // FORMATTING
    // ─────────────────────────────────────────────────────────────────────

    function formatCountdown(ms) {
      if (!isFinite(ms) || ms <= 0) return '0h 0m 0s';
      var totalSec = Math.floor(ms / 1000);
      var h = Math.floor(totalSec / 3600);
      var m = Math.floor((totalSec % 3600) / 60);
      var s = totalSec % 60;
      return h + 'h ' + m + 'm ' + s + 's';
    }

    function getUserTimezone() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone;
      } catch (e) {
        return 'Unknown';
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // DOM — all references cached, all writes via textContent (no innerHTML)
    // ─────────────────────────────────────────────────────────────────────
    var $hero      = document.getElementById('hero');
    var $countdown = document.getElementById('countdown');
    var $sub       = document.getElementById('sub');
    var $progWrap  = document.getElementById('progress-section');
    var $progFill  = document.getElementById('prog-fill');
    var $canvas    = document.getElementById('confetti');

    var userTZ = getUserTimezone();

    // Build sub-text safely (no innerHTML with user data)
    function setSubText(message) {
      // Clear existing children
      while ($sub.firstChild) $sub.removeChild($sub.firstChild);
      $sub.appendChild(document.createTextNode(message));
      var tz = document.createElement('span');
      tz.className = 'tz';
      tz.textContent = userTZ;
      $sub.appendChild(tz);
    }

    // Apply data-state attribute to multiple elements
    function setStateAttr(state) {
      var els = [$hero, $countdown, $progFill];
      for (var i = 0; i < els.length; i++) {
        els[i].setAttribute('data-state', state);
      }
    }

    // Track previous state for transitions
    var prevState = null;

    function render() {
      var result = getState();
      var state = result.state;
      var msUntilChange = result.msUntilChange;
      var periodStartMs = result.periodStartMs;
      var periodEndMs = result.periodEndMs;

      setStateAttr(state);

      if (state === 'not-started') {
        $hero.textContent = '2X maxxing in';
        $countdown.textContent = formatCountdown(msUntilChange);
        setSubText('Your usage limits begin double outside peak hours \u00b7 ');
        $progFill.style.width = '0%';
        $progWrap.setAttribute('aria-valuenow', '0');
        return;
      }

      if (state === 'expired') {
        $hero.textContent = '2X period concluded';
        $countdown.textContent = '';
        setSubText('The promotional 2\u00d7 usage limits ended on March 27, 2026. ');
        $progFill.style.width = '100%';
        $progWrap.setAttribute('aria-valuenow', '100');
        return;
      }

      if (state === 'boosted') {
        $hero.textContent = '2X maxxing for';
        $countdown.textContent = formatCountdown(msUntilChange);
        setSubText('Your usage limits are doubled right now \u00b7 ');
      } else {
        // peak
        $hero.textContent = 'Peak limits ending in';
        $countdown.textContent = formatCountdown(msUntilChange);
        setSubText('Standard usage limits during peak hours \u00b7 ');
      }

      // Progress bar
      var now = Date.now();
      var elapsed = now - periodStartMs;
      var total = periodEndMs - periodStartMs;
      var pct = total > 0 ? Math.min(100, Math.max(0, (elapsed / total) * 100)) : 0;
      $progFill.style.width = pct.toFixed(1) + '%';
      $progWrap.setAttribute('aria-valuenow', Math.round(pct).toString());

      // Launch confetti on state transition to boosted
      if (state === 'boosted' && prevState !== 'boosted') {
        launchConfetti();
      }

      // Update background animation
      updateTrafficState(state);

      prevState = state;
    }

    // ─────────────────────────────────────────────────────────────────────
    // CONFETTI — self-cleaning, respects prefers-reduced-motion
    // ─────────────────────────────────────────────────────────────────────
    var confettiRafId = null;

    function launchConfetti() {
      // Respect reduced motion preference
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      // Cancel any in-progress confetti
      if (confettiRafId) {
        cancelAnimationFrame(confettiRafId);
        confettiRafId = null;
      }

      var ctx = $canvas.getContext('2d');
      if (!ctx) return;

      $canvas.width = window.innerWidth;
      $canvas.height = window.innerHeight;

      var particles = [];
      var colors = ['#00ff88', '#00cc6a', '#88ffbb', '#ffffff', '#00ffcc'];
      var count = Math.min(80, Math.floor(window.innerWidth / 8)); // fewer on small screens

      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * $canvas.width,
          y: Math.random() * $canvas.height - $canvas.height,
          w: Math.random() * 8 + 4,
          h: Math.random() * 6 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 3 + 2,
          wobble: Math.random() * 4 - 2,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 6 - 3,
          opacity: 1
        });
      }

      var frame = 0;

      function animate() {
        ctx.clearRect(0, 0, $canvas.width, $canvas.height);
        var alive = false;

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.y += p.speed;
          p.x += p.wobble * Math.sin(frame * 0.05);
          p.rotation += p.rotSpeed;

          if (frame > 60) p.opacity -= 0.01;
          if (p.opacity <= 0) continue;

          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }

        frame++;
        if (alive) {
          confettiRafId = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, $canvas.width, $canvas.height);
          confettiRafId = null;
        }
      }

      confettiRafId = requestAnimationFrame(animate);
    }

    // ─────────────────────────────────────────────────────────────────────
    // MINDBLOWING TRAFFIC ANIMATION (Retro Horizontal Speedlines)
    // ─────────────────────────────────────────────────────────────────────
    var tCanvas = document.getElementById('traffic-canvas');
    var tCtx = tCanvas.getContext('2d', { alpha: true }); // Need alpha for background compositing
    var tLines = [];
    var tRafId = null;

    // State uniforms
    var currentSpeedMultiplier = 1.0;
    var targetSpeedMultiplier = 1.0;

    function initTraffic() {
      // Re-measure canvas based on parent container logic
      var topSection = document.querySelector('.top-section');
      tCanvas.width = topSection.offsetWidth;
      tCanvas.height = topSection.offsetHeight;

      // Init 200 horizontal lines
      tLines = [];
      for (var i = 0; i < 200; i++) {
        tLines.push({
          x: Math.random() * tCanvas.width,
          y: Math.random() * tCanvas.height,
          length: Math.random() * 200 + 50,
          speed: Math.random() * 5 + 2,
          thickness: Math.random() * 2 + 0.5,
          opacity: Math.random() * 0.4 + 0.1
        });
      }
    }

    function updateTrafficState(appState) {
      if (appState === 'boosted') {
        targetSpeedMultiplier = 6.0;   // Fast motion
      } else if (appState === 'peak') {
        targetSpeedMultiplier = 0.5;   // Very slow
      } else {
        targetSpeedMultiplier = 1.0;   // Normal
      }
    }

    function drawTraffic() {
      // Respect reduced motion
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
        return;
      }

      currentSpeedMultiplier += (targetSpeedMultiplier - currentSpeedMultiplier) * 0.05;

      // Clear with slight trailing effect for motion blur
      tCtx.fillStyle = 'rgba(238, 223, 204, 0.3)'; // Match var(--bg-light) exactly
      tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);

      for (var i = 0; i < tLines.length; i++) {
        var line = tLines[i];
        
        // Move line rightwards
        line.x += line.speed * currentSpeedMultiplier;

        // Reset if it goes off screen
        if (line.x > tCanvas.width) {
          line.x = -line.length - 10;
          line.y = Math.random() * tCanvas.height;
        }

        // Draw line
        tCtx.beginPath();
        tCtx.moveTo(line.x, line.y);
        tCtx.lineTo(line.x + line.length, line.y);
        tCtx.lineWidth = line.thickness;

        // Base colour is brown, with tiny hints of green/red depending on the state
        var styleColor = 'rgba(123, 92, 70, ' + line.opacity + ')';
        if (prevState === 'boosted' && Math.random() > 0.8) {
             styleColor = 'rgba(0, 150, 80, ' + line.opacity + ')';
        } else if (prevState === 'peak' && Math.random() > 0.8) {
             styleColor = 'rgba(200, 50, 50, ' + line.opacity + ')';
        }

        tCtx.strokeStyle = styleColor;
        tCtx.stroke();
      }

      tRafId = requestAnimationFrame(drawTraffic);
    }
    initTraffic();
    drawTraffic();

    // ─────────────────────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────────────────────

    // Initial render
    prevState = getState().state;
    render();

    // Launch confetti on first load if boosted
    if (prevState === 'boosted') {
      launchConfetti();
    }

    // Tick every second — single interval, no leaks (page-level lifecycle)
    var tickInterval = setInterval(render, 1000);

    // Pause ticking when page is hidden (saves CPU, prevents stale countdowns)
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        clearInterval(tickInterval);
        tickInterval = null;
      } else {
        // Immediately re-render on return (catch up after sleep/tab switch)
        render();
        if (!tickInterval) {
          tickInterval = setInterval(render, 1000);
        }
      }
    });

    // Resize confetti and traffic canvas (debounced)
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var topSect = document.querySelector('.top-section');
        $canvas.width = window.innerWidth;
        $canvas.height = window.innerHeight;
        tCanvas.width = topSect.offsetWidth;
        tCanvas.height = topSect.offsetHeight;
        resizeTimer = null;
      }, 150);
    });
  </script>
</body>
</html>
